name: release

# Push a tag such as v0.1.0 to build both architectures and publish the release zip.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The driver reports project(VERSION) from CMakeLists.txt, so the tag must say the same.
      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          $m = Select-String -Path CMakeLists.txt -Pattern 'project\(rp1210_cansub VERSION ([0-9.]+)'
          $version = $m.Matches[0].Groups[1].Value
          if ("${{ github.ref_name }}" -ne "v$version") {
            Write-Error "Tag ${{ github.ref_name }} does not match project version $version in CMakeLists.txt"
            exit 1
          }

      - name: Build x86 and x64, assemble dist
        shell: cmd
        run: build.bat

      - name: Unit tests
        run: |
          ctest --preset x86
          ctest --preset x64

      - name: Zip
        shell: pwsh
        run: |
          $name = "rp1210-cansub-${{ github.ref_name }}"
          Copy-Item dist $name -Recurse
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "rp1210-cansub-${{ github.ref_name }}.zip" --title "${{ github.ref_name }}" --generate-notes
